<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Tracker for Firefox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            width: 320px;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
        }
        
        h3 {
            color: #4361ee;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .toggle-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
            padding: 10px;
            border-radius: 6px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        #trackingToggle {
            margin-right: 10px;
            transform: scale(1.2);
        }
        
        .status-indicator {
            margin-left: auto;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-on {
            background-color: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
        }
        
        .status-off {
            background-color: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
        }
        
        .input-group {
            margin: 15px 0;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 14px;
        }
        
        #recipientEmail {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #4361ee;
            color: white;
            font-weight: 500;
            cursor: pointer;
            margin: 5px 0;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #3a56d4;
        }
        
        .btn-secondary {
            background-color: #6c757d;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
            max-width: 80%;
            text-align: center;
        }
        
        .toast.show {
            opacity: 1;
        }
        
        .toast.success {
            background: #4CAF50;
        }
        
        .toast.error {
            background: #F44336;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h3><i class="fas fa-envelope-open-text"></i> Mail Tracker</h3>
    
    <div class="toggle-container">
        <input type="checkbox" id="trackingToggle">
        <label for="trackingToggle">Enable Tracking</label>
        <span id="statusText" class="status-indicator status-off">OFF</span>
    </div>
    
    <div class="input-group">
        <label for="recipientEmail">Recipient Email:</label>
        <input type="email" id="recipientEmail" placeholder="e.g. recipient@example.com">
    </div>
    
    <button type="button" id="saveBtn" class="btn">Save Settings</button>
    <button type="button" id="dashboardBtn" class="btn btn-secondary">Open Dashboard</button>

    <script src="popup.js"></script>
</body>
</html>
